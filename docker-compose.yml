services:
  firewall-monitoring-db:
    image: postgres:18-alpine
    container_name: firewall-monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: firewall_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: firewall_secret_2026!
    volumes:
      - ./pgdata:/var/lib/postgresql
    networks:
      mcvlanprod:
        ipv4_address: 10.40.0.151

  firewall-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    image: firewall-monitoring:latest
    container_name: firewall-monitoring-console
    restart: unless-stopped
    depends_on:
      - firewall-monitoring-db
    environment:
      - PORT=80
      - SYSLOG_PORT=1514
      - NETFLOW_PORT=2055
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
      - DATABASE_URL=postgresql://postgres:firewall_secret_2026!@10.40.0.151:5432/firewall_telemetry
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      mcvlanprod:
        ipv4_address: 10.40.0.150

networks:
  mcvlanprod:
    external: true
