version: '3.8'

services:
  firewall-monitoring-db:
    image: postgres:16-alpine
    container_name: firewall-appliance-db
    restart: always
    environment:
      POSTGRES_DB: firewall_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: firewall_secret_2026!
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  firewall-monitoring-appliance:
    image: firewall-monitoring-appliance:latest
    container_name: firewall-appliance
    restart: always
    depends_on:
      - firewall-monitoring-db
    ports:
      - "80:80/tcp"
      - "1514:1514/udp"
      - "2055:2055/udp"
      - "514:514/udp"
    environment:
      - PORT=80
      - SYSLOG_PORT=1514
      - NETFLOW_PORT=2055
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - DATABASE_URL=postgresql://postgres:firewall_secret_2026!@firewall-monitoring-db:5432/firewall_telemetry
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
