version: '3.8'

services:
  firewall-monitoring-appliance:
    image: firewall-monitoring-appliance:latest
    container_name: firewall-appliance
    restart: always
    ports:
      - "80:80/tcp"
      - "1514:1514/udp"
      - "2055:2055/udp"
      - "514:514/udp"
    environment:
      - PORT=80
      - SYSLOG_PORT=1514
      - NETFLOW_PORT=2055
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
