# ==============================================================================
# Enterprise Firewall Telemetry & Security Operations Center
# Standalone Universal VM Deployment (Ubuntu, Rocky Linux, RHEL, Debian)
# Bridge Network Architecture - Runs on any Virtual Machine or Bare Metal Host
# ==============================================================================
version: '3.8'

services:
  # Relational Database: PostgreSQL 18 Alpine
  # Manages user accounts, RBAC, telemetry metadata, compliance controls, and backups
  firewall-monitoring-db:
    image: postgres:18-alpine
    container_name: firewall-monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: firewall_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: firewall_secret_2026!
    volumes:
      - pg18_data:/var/lib/postgresql/data
    networks:
      - firewall-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firewall_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Time-Series Database: InfluxDB 2.7 Alpine
  # High-velocity batch telemetry & syslog storage with CERT-In 180-day retention
  firewall-monitoring-tsdb:
    image: influxdb:2.7-alpine
    container_name: firewall-monitoring-tsdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=InfluxSecure2026!
      - DOCKER_INFLUXDB_INIT_ORG=csir-serc
      - DOCKER_INFLUXDB_INIT_BUCKET=firewall_logs
      - DOCKER_INFLUXDB_INIT_RETENTION=180d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=influx-firewall-token-2026-supersecret
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - firewall-net
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Core Operations Console & Collectors
  # Real-time Web UI, REST/WS API, SNMP Poller & Trap Receiver, Syslog & NetFlow Ingest
  firewall-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    image: firewall-monitoring:latest
    container_name: firewall-monitoring-console
    restart: unless-stopped
    depends_on:
      firewall-monitoring-db:
        condition: service_healthy
      firewall-monitoring-tsdb:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "162:162/udp"   # SNMP Trap Receiver (v2c / v3 fortinet)
      - "1514:1514/udp" # Syslog Primary Collector
      - "514:514/udp"   # Syslog Legacy/Standard Port
      - "2055:2055/udp" # NetFlow v5/v9 & IPFIX Flow Ingest
    environment:
      - PORT=80
      - SYSLOG_PORT=1514
      - NETFLOW_PORT=2055
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
      - DATABASE_URL=postgresql://postgres:firewall_secret_2026!@firewall-monitoring-db:5432/firewall_telemetry
      - INFLUX_URL=http://firewall-monitoring-tsdb:8086
      - INFLUX_TOKEN=influx-firewall-token-2026-supersecret
      - INFLUX_ORG=csir-serc
      - INFLUX_BUCKET=firewall_logs
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - firewall-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  firewall-net:
    driver: bridge
    name: firewall-telemetry-net

volumes:
  pg18_data:
    name: firewall-telemetry-pg18
  influx_data:
    name: firewall-telemetry-influxdb2
